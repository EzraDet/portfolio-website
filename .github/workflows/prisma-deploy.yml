name: Deploy to Prisma
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy with Prisma
        uses: prisma/cloud-deploy-action@v1
        with:
          module: server.js
