<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Doung Det Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      padding: 1.5rem;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .login-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.8rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    }

    .login-card h1 {
      text-align: center;
      color: #1e293b;
      font-size: 1.5rem;
      margin-bottom: 0.35rem;
    }

    .login-card p.subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .form-group { margin-bottom: 1.25rem; }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1rem;
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      background: #f8fafc;
    }

    .input-wrap input:focus {
      border-color: #4f46e5;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .toggle-pass {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 1rem;
      padding: 0;
    }

    .toggle-pass:hover { color: #4f46e5; }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      background: #fee2e2;
      color: #991b1b;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      border-left: 4px solid #ef4444;
      display: none;
    }

    .error-msg.show { display: block; animation: shake 0.3s; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }

    .back-home:hover { color: #4f46e5; }

    .back-home i { margin-right: 0.35rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">
      <i class="fas fa-lock"></i>
    </div>

    <h1>Admin Login</h1>
    <p class="subtitle">Sign in to manage your portfolio</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-key"></i>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <a href="/" class="back-home">
      <i class="fas fa-arrow-left"></i> Back to Portfolio
    </a>
  </div>

  <script>
    const form     = document.getElementById('loginForm');
    const btn      = document.getElementById('loginBtn');
    const errorEl  = document.getElementById('errorMsg');
    const toggle   = document.getElementById('togglePass');
    const passInput = document.getElementById('password');

    // Toggle password visibility
    toggle.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      toggle.innerHTML = isPass ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
    });

    // Check if already logged in
    fetch('/api/me', { cache: 'no-store' })
      .then(r => r.json())
      .then(d => { if (d.loggedIn) window.location.href = '/admin'; })
      .catch(() => {});

    // Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');

      const username = document.getElementById('username').value.trim();
      const password = passInput.value;

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          cache: 'no-store'
        });
        const data = await res.json();

        if (res.ok && data.success) {
          btn.innerHTML = '<i class="fas fa-check"></i> Success!';
          setTimeout(() => window.location.href = '/admin', 400);
        } else {
          throw new Error(data.message || 'Login failed');
        }
      } catch (err) {
        errorEl.textContent = '❌ ' + err.message;
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });
  </script>
</body>
</html>
